# KOF '96 original MVS program (214-p1.p1 + 214-p2.sp2).
# Addresses are byte offsets in the complete program, NOT banked CPU addresses.
# CRC32 covers big-endian bytes [0x80, program_size). BIOS vectors are excluded.
#
# Every stage map is 768 pixels wide and the camera runs over [0,448], so a
# 400-pixel view centered on it would leave the map by 40 pixels at both
# edges. The view is instead shifted inward near the edges (at most 40
# pixels): stage layers by the renderer from [layers], world objects by the
# routine at 0x6be00. Camera, walls, collisions and HUD are not modified.
# See docs/KOF96_WIDESCREEN_RESEARCH.md.
[profile]
version = 2
game = kof96
ngh = 0x0214
program_size = 0x300000
program_crc32 = 0xcb72d23c
status = verified
description = 400x225 stage view kept inside each finite map, native camera and gameplay

# Stage-layer records scheduled by 0x9140 (A5=0x108000, A5+0x30ae).
# The callback runs while bit 7 of byte +0x90 is set. Record 0 is the
# main layer, whose X is the camera.
[layers]
address = 0x10b0ae
count = 8
stride = 0x100
active = 0x90
active_mask = 0x8000
x = 0x18
width = 0x7a
sprite = 0x70
columns = 0x78
main = 0

# SCB3 height gates of the column producers, 9.7 fixed-point origins.
# Native shows (x + 15*128) <= 324*128. The ring of columns is unique modulo
# the 512-pixel hardware wrap, so all of them stay visible and the renderer
# clips the shifted columns to the view.
[patch background-fixed-first]
offsets = 0x6fe0
original = 0642 0780 0c42 a200 6204 30c4
wide = 0642 0780 0c42 ffff 6204 30c4

[patch background-fixed-following]
offsets = 0x7004
original = 0642 0780 0c42 a200 6208 30c4
wide = 0642 0780 0c42 ffff 6208 30c4

[patch background-fixed-offset-first]
offsets = 0x7262
original = 0642 0780 0c42 a200 620a 4883
wide = 0642 0780 0c42 ffff 620a 4883

[patch background-fixed-offset-following]
offsets = 0x728e
original = 0642 0780 0c42 a200 620e 4883
wide = 0642 0780 0c42 ffff 620e 4883

# Corresponding integer-coordinate paths. Do not change the layer/pool counts.
[patch background-integer-first]
offsets = 0x7042
original = 0642 000f 0c42 0144 6204 30c4
wide = 0642 000f 0c42 ffff 6204 30c4

[patch background-integer-following]
offsets = 0x706a
original = 0642 000f 0c42 0144 6208 30c4
wide = 0642 000f 0c42 ffff 6208 30c4

[patch background-integer-offset-first]
offsets = 0x72d8
original = 0642 000f 0c42 0144 620a 4883
wide = 0642 000f 0c42 ffff 620a 4883

[patch background-integer-offset-following]
offsets = 0x7308
original = 0642 000f 0c42 0144 620e 4883
wide = 0642 000f 0c42 ffff 620e 4883

# Column streaming of the 514-pixel windows (0x6bd2), used only by stage
# callbacks: keep [X-48, X+376) loaded instead of [X-16, X+336).
[patch stream-right]
offsets = 0x76a6
original = 302c 0018 0640 0150 0240 fff0 b06c 0088
wide = 302c 0018 0640 0178 0240 fff0 b06c 0088

[patch stream-left]
offsets = 0x76be
original = 302c 0018 0440 0010 0240 fff0 b06c 008a
wide = 302c 0018 0440 0030 0240 fff0 b06c 008a

# Object parts: reject only when wholly left of -40 (0x6be60), shift world
# objects (0x6be00) and reject from the right at 360 instead of 320.
[patch object-left-call]
offsets = 0x5368
original = 322d 6022 e949 4441 3b41 6018 0242 0001
wide = 322d 6022 e949 4eb9 0006 be60 0242 0001

[patch object-pan-call]
offsets = 0x53ac
original = 4a44 6702 4440 da6c 0024 9a40 ba6d 6018 6f00 010c 0c45 0140 6e00 0104 ef4d
wide = 4a44 6702 4440 4eb9 0006 be00 ba6d 6018 6f00 010c 0c45 0168 6e00 0104 ef4d

# Unused 0xffff fill. The original two instructions, then for objects not
# fixed to the screen (bit 4 of $3b(a4)) while the main layer is active
# and at least 25 tiles wide: d5 -= clamp(0, 40-X, W*16-360-X), bounded to
# [-40,40], the same shift the renderer gives the main layer. d0/d1 are
# reloaded before their next use.
[patch object-pan-routine]
offsets = 0x6be00
original = ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff
wide = da6c 0024 9a40 082c 0004 003b 6640 4a39 0010 b13e 6a38 3239 0010 b128 0c41 0019 652c 3039 0010 b0c6 e949 0441 0168 9240 6c0a 0c41 ffd8 6c14 72d8 6010 7228 9240 6f0c 0c41 0028 6f04 7228 4e71 9a41 4e75

# $6018 = -16*width - 40: the part is drawn unless it ends left of -40.
[patch object-left-routine]
offsets = 0x6be60
original = ffff ffff ffff ffff ffff ffff ffff
wide = 4441 3b41 6018 046d 0028 6018 4e75

# KOF '96 original MVS program (214-p1.p1 + 214-p2.sp2).
# Experimental: verify stages, scroll limits and scaled layers before promoting.
# Needs NJEMU_MVS_ALLOW_EXPERIMENTAL=1 as well as widescreen being requested.
# Known finite-map seam at the camera edge; camera trial is NOT included.
# See docs/KOF96_WIDESCREEN_RESEARCH.md for measured coverage and limitations.
[profile]
version = 1
game = kof96
ngh = 0x0214
program_size = 0x300000
program_crc32 = 0xcb72d23c
status = experimental
description = Extended background visibility, original camera/collision/pools, stage coverage incomplete

# SCB3 height selection, 9.7 fixed-point column origins.
# Original unsigned (x + 15*128) <= 324*128; wide (-55 <= x <= 359).
# Both the normal and per-column vertical-offset paths retain their hide flags.
[patch background-fixed-first]
offsets = 0x6fe0
original = 0642 0780 0c42 a200 6204 30c4
wide = 0642 1b80 0c42 cf00 6204 30c4

[patch background-fixed-following]
offsets = 0x7004
original = 0642 0780 0c42 a200 6208 30c4
wide = 0642 1b80 0c42 cf00 6208 30c4

[patch background-fixed-offset-first]
offsets = 0x7262
original = 0642 0780 0c42 a200 620a 4883
wide = 0642 1b80 0c42 cf00 620a 4883

[patch background-fixed-offset-following]
offsets = 0x728e
original = 0642 0780 0c42 a200 620e 4883
wide = 0642 1b80 0c42 cf00 620e 4883

# Corresponding integer-coordinate paths. Do not change the layer/pool counts.
[patch background-integer-first]
offsets = 0x7042
original = 0642 000f 0c42 0144 6204 30c4
wide = 0642 0037 0c42 019e 6204 30c4

[patch background-integer-following]
offsets = 0x706a
original = 0642 000f 0c42 0144 6208 30c4
wide = 0642 0037 0c42 019e 6208 30c4

[patch background-integer-offset-first]
offsets = 0x72d8
original = 0642 000f 0c42 0144 620a 4883
wide = 0642 0037 0c42 019e 620a 4883

[patch background-integer-offset-following]
offsets = 0x7308
original = 0642 000f 0c42 0144 620e 4883
wide = 0642 0037 0c42 019e 620e 4883

# Right-hand foreground drawing rejection only, not gameplay movement bounds.
# The existing dynamic left bound is retained; off-screen actor coverage needs review.
[patch foreground-right]
offsets = 0x53c0
original = 0c45 0140 6e00 0104 ef4d
wide = 0c45 0168 6e00 0104 ef4d

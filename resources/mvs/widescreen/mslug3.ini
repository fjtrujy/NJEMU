# Original encrypted MVS Metal Slug 3, after emulator decryption.
# Addresses are byte offsets in the complete program, NOT banked CPU addresses.
# CRC32 covers big-endian bytes [0x80, program_size). BIOS vectors are excluded.
[profile]
version = 1
game = mslug3
ngh = 0x0256
program_size = 0x900000
program_crc32 = 0x714dc992
status = verified
description = 400x225 scene extension, centered FIX, native gameplay boundaries

# Sprite column origins: 10.6 fixed point, [-8,312) -> [-56,360).
# A4+4/+6 are allocation indices and must NOT be widened.
[patch sprite-columns-a]
offsets = 0xdec8, 0xe170, 0xe416, 0xe6c2, 0xf70a, 0xf9d4, 0xfca6, 0xff7e, 0x110d6, 0x1137c, 0x11620, 0x118ca
original = 3405 0642 0200 0c42 5000 64dc
wide = 3405 0642 0e00 0c42 6800 64dc

[patch sprite-columns-b]
offsets = 0xe98e, 0xecee, 0xf04a, 0xf3b6, 0x10288, 0x10626, 0x109ca, 0x10d7e, 0x11b94, 0x11ef2, 0x1224c, 0x125b6
original = 3405 0642 0200 0c42 5000 64ca
wide = 3405 0642 0e00 0c42 6800 64ca

[patch sprite-columns-c]

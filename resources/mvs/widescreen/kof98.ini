# KOF '98 original MVS program (242-p1.p1 + 242-p2.sp2), after decryption.
# Addresses are byte offsets in the complete program, NOT banked CPU addresses.
# CRC32 covers big-endian bytes [0x80, program_size). BIOS vectors are excluded.
#
# Same engine as KOF '96 (see kof96.ini): 768-pixel stage maps, camera over
# [0,448]. Near the edges the view shifts inward by up to 40 pixels: stage
# layers by the renderer from [layers], world objects by 0xa7e00. Camera,
# walls, collisions and HUD are not modified.
# See docs/KOF96_WIDESCREEN_RESEARCH.md, section "KOF '98".
[profile]
version = 2
game = kof98
ngh = 0x0242
program_size = 0x600000
program_crc32 = 0xc84c6f28
status = verified
description = 400x225 stage view kept inside each finite map, native camera and gameplay

# Stage-layer records scheduled by 0xa332 (A5=0x108000, A5+0x30b4).
# The callback runs while bit 7 of byte +0x90 is set. Record 0 is the
# main layer, whose X is the camera.
[layers]
address = 0x10b0b4
count = 8
stride = 0x100
active = 0x90
active_mask = 0x8000
x = 0x18
width = 0x7a
sprite = 0x70
columns = 0x78
main = 0

# SCB3 height gates of the column producers. Native shows
# (x + 15*128) <= 332*128. The 32-column ring is unique modulo the
# 512-pixel hardware wrap, so all columns stay visible and the renderer
# clips the shifted columns to the view.

[patch background-fixed-7fc8]
offsets = 0x7fc8
original = 0642 0780 0c42 a600 6204 30c4
wide = 0642 0780 0c42 ffff 6204 30c4

[patch background-fixed-7fec]
offsets = 0x7fec
original = 0642 0780 0c42 a600 6208 30c4
wide = 0642 0780 0c42 ffff 6208 30c4

[patch background-fixed-824a]
offsets = 0x824a
original = 0642 0780 0c42 a600 620a 4883
wide = 0642 0780 0c42 ffff 620a 4883

[patch background-fixed-8276]
offsets = 0x8276
original = 0642 0780 0c42 a600 620e 4883
wide = 0642 0780 0c42 ffff 620e 4883

[patch background-integer-802a]
offsets = 0x802a
original = 0642 000f 0c42 014c 6204 30c4
wide = 0642 000f 0c42 ffff 6204 30c4

[patch background-integer-8052]
offsets = 0x8052
original = 0642 000f 0c42 014c 6208 30c4
wide = 0642 000f 0c42 ffff 6208 30c4

[patch background-integer-82c0]
offsets = 0x82c0
original = 0642 000f 0c42 014c 620a 4883
wide = 0642 000f 0c42 ffff 620a 4883

[patch background-integer-82f0]
offsets = 0x82f0
original = 0642 000f 0c42 014c 620e 4883
wide = 0642 000f 0c42 ffff 620e 4883

# Column windows of both initializers: [X-64, X+384) instead of [X-16, X+336).
# The rows streamer reloads [X-96, X+416), which always contains it.
[patch window-tile-init]
offsets = 0x7b56
original = 0440 0010 3940 008a 0640 0160 3940 0088
wide = 0440 0040 3940 008a 0640 01c0 3940 0088

[patch window-pixel-init]
offsets = 0x7bee
original = 3940 008a 046c 0010 008a 3940 0088 066c 0150 0088
wide = 3940 008a 046c 0040 008a 3940 0088 066c 0180 0088

# Column streaming at 0x8686, called by stage callbacks: right and left
# thresholds add up to the 448-pixel window, as the native ones did to 352.
[patch stream-right]
offsets = 0x868e
original = 302c 0018 0640 0150 0240 fff0 b06c 0088
wide = 302c 0018 0640 0180 0240 fff0 b06c 0088

[patch stream-left]
offsets = 0x86a6
original = 302c 0018 0440 0010 0240 fff0 b06c 008a
wide = 302c 0018 0440 0040 0240 fff0 b06c 008a

# Object parts: reject only when wholly left of -40 (0xa7e60), shift world
# objects (0xa7e00) and reject from the right at 360 instead of 320.
[patch object-left-call]
offsets = 0x6230
original = 322d 64c0 e949 4441 3b41 64b6 0242 0001
wide = 322d 64c0 e949 4eb9 000a 7e60 0242 0001

[patch object-pan-call]
offsets = 0x6274
original = 4a44 6702 4440 da6c 0024 9a40 ba6d 64b6 6f00 010c 0c45 0140 6e00 0104 ef4d
wide = 4a44 6702 4440 4eb9 000a 7e00 ba6d 64b6 6f00 010c 0c45 0168 6e00 0104 ef4d

# Unused 0xffff fill. The original two instructions, then for objects not
# fixed to the screen (bit 4 of $3b(a4)) while the main layer is active
# and at least 25 tiles wide: d5 -= clamp(0, 40-X, W*16-360-X), bounded to
# [-40,40], the same shift the renderer gives the main layer.
[patch object-pan-routine]
offsets = 0xa7e00
original = ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff ffff
wide = da6c 0024 9a40 082c 0004 003b 6640 4a39 0010 b144 6a38 3239 0010 b12e 0c41 0019 652c 3039 0010 b0cc e949 0441 0168 9240 6c0a 0c41 ffd8 6c14 72d8 6010 7228 9240 6f0c 0c41 0028 6f04 7228 4e71 9a41 4e75

# $64b6 = -16*width - 40: the part is drawn unless it ends left of -40.
[patch object-left-routine]
offsets = 0xa7e60
original = ffff ffff ffff ffff ffff ffff ffff
wide = 4441 3b41 64b6 046d 0028 64b6 4e75

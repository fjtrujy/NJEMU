# Street Fighter II: The World Warrior (World 910522), CPS1 program.
# Addresses are byte offsets in the program region (2 MiB, of which the game
# uses the first), NOT banked addresses. The routines live in the unused
# upper half, which NJEMU maps and fetches like the rest of the ROM.
#
# Fights keep the scroll2 camera c in [0,384]: the native view sees stage
# X [64,832) of the 1024-pixel tilemaps, which hold no art beyond it. The
# 480-pixel view [16,496) therefore shifts by 48 - c/4: 48 pixels inward at
# either edge, none at the center. Applied alike to the three scroll layers
# (0x1736) and to objects placed by a layer camera (0x7f546), it keeps every
# layer or row scrolling at least 1/4 as fast as scroll2 inside the area it
# shows natively (scroll3 moves 0.46-0.77 as fast). Screen-fixed objects,
# the HUD, keep their place.
# The game's camera, walls and collisions are not modified.
# See docs/CPS_WIDESCREEN.md.
[profile]
version = 1
game = sf2
ngh = 0x0000
program_size = 0x200000
program_crc32 = 0x661a8e65
status = verified
description = 480x224 stage view kept inside each stage, native camera and gameplay

# Scroll shadow registers for the next frame (vblank, 0x166a -> 0x1736):
# d1.w = -64 + shift instead of -64, so scroll1/2/3 move together. This runs
# in the vblank handler with the supervisor stack at the top of work RAM, so
# it jumps out and back instead of calling, and uses only d0, which the
# original code reloads next. The bytes after the jump stay original: the
# game scans 0x166a-0x1832 for NOP (0x931e) and then jumps to its test menu.
[patch scroll-jump]
offsets = 0x1736
original = 323c ffc0 33ed 0060 0080 010c 302d 0036 d041 3b40 0060
wide = 4ef9 001f f040 0060 0080 010c 302d 0036 d041 3b40 0060

# Screen X of objects placed by the scroll1, scroll2 (two paths) and scroll3
# cameras: x - camera + 64 - shift.
[patch object-scroll1]
offsets = 0x7f560
original = 906d 0b58 0640 0040 3229 000a 926d 0b5c
wide = 906d 0b58 4eb9 001f f080 4e71 926d 0b5c

[patch object-scroll2]
offsets = 0x7f58a, 0x7f5c6
original = 906d 0bd8 0640 0040 3229 000a 926d 0bdc
wide = 906d 0bd8 4eb9 001f f080 4e71 926d 0bdc

[patch object-scroll3]
offsets = 0x7f5ea
original = 906d 0c58 0640 0040 3229 000a 926d 0c5c
wide = 906d 0c58 4eb9 001f f080 4e71 926d 0c5c

# d2 = shift for the scroll2 camera register value c in d2: 0 unless
# fighting ($ff8009 == 2) with c in [0,384], else 48 - (c >> 2).
# The scroll routine below inlines the same computation on d0.
[patch shift-routine]
offsets = 0x1ff000
original = 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000
wide = 0c39 0002 00ff 8009 6610 0c42 0180 620a e442 4442 0642 0030 4e75 7400 4e75

[patch scroll-routine]
offsets = 0x1ff040
original = 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000
wide = 33ed 0060 0080 010c 302d 003a 0440 0040 323c ffc0 0c39 0002 00ff 8009 6610 0c40 0180 620a e440 4440 0640 0030 d240 4ef9 0000 1742

# The scroll2 camera register is $ff8bd8 - 256 when objects are placed.
[patch object-routine]
offsets = 0x1ff080
original = 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000
wide = 0640 0040 3f02 3439 00ff 8bd8 0442 0100 6100 ff6e 9042 341f 3229 000a 4e75

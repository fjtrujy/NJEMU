# Street Fighter II': Champion Edition (World 920513), CPS1 program.
# Addresses are byte offsets in the program region (2 MiB, of which the game
# uses the first 1.5), NOT banked addresses. The routines live in the unused
# tail, which NJEMU maps and fetches like the rest of the ROM.
#
# Same method as sf2.ini: fights keep the scroll2 camera c in [0,384], the
# 480-pixel view [16,496) shifts by 48 - c/4, applied alike to the three
# scroll layers (0x15a2) and to objects placed by a layer camera (0x98036).
# Screen-fixed objects, the HUD, keep their place.
# The game's camera, walls and collisions are not modified.
# See docs/CPS_WIDESCREEN.md.
[profile]
version = 1
game = sf2ce
ngh = 0x0000
program_size = 0x200000
program_crc32 = 0x7778f388
status = verified
description = 480x224 stage view kept inside each stage, native camera and gameplay

# Scroll shadow registers for the next frame (0x15a2): d1.w = -64 + shift
# instead of -64, so scroll1/2/3 move together. It jumps out and back
# instead of calling and uses only d0 and d1, as the original code does.
[patch scroll-jump]
offsets = 0x15a2
original = 323c ffc0 302d 0032 d041 3b40 005c
wide = 4ef9 001f f040 0032 d041 3b40 005c

# Screen X of objects placed by the scroll1, scroll2 (two paths) and scroll3
# cameras: x - camera + 64 - shift.
[patch object-scroll1]
offsets = 0x98050
original = 906d 0b44 0640 0040 3229 000a 926d 0b48
wide = 906d 0b44 4eb9 001f f080 4e71 926d 0b48

[patch object-scroll2]
offsets = 0x9807a, 0x980b6
original = 906d 0bc4 0640 0040 3229 000a 926d 0bc8
wide = 906d 0bc4 4eb9 001f f080 4e71 926d 0bc8

[patch object-scroll3]
offsets = 0x980da
original = 906d 0c44 0640 0040 3229 000a 926d 0c48
wide = 906d 0c44 4eb9 001f f080 4e71 926d 0c48

# d2 = shift for the scroll2 camera register value c in d2: 0 unless
# fighting ($ff8009 == 2) with c in [0,384], else 48 - (c >> 2).
# The scroll routine below inlines the same computation on d0.
[patch shift-routine]
offsets = 0x1ff000
original = 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000
wide = 0c39 0002 00ff 8009 6610 0c42 0180 620a e442 4442 0642 0030 4e75 7400 4e75

# The scroll2 camera is $36(a5); its register value is that minus 64.
[patch scroll-routine]
offsets = 0x1ff040
original = 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000
wide = 302d 0036 0440 0040 323c ffc0 0c39 0002 00ff 8009 6610 0c40 0180 620a e440 4440 0640 0030 d240 302d 0032 4ef9 0000 15aa

# The scroll2 camera register is $ff8bc4 - 256 when objects are placed.
[patch object-routine]
offsets = 0x1ff080
original = 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000
wide = 0640 0040 3f02 3439 00ff 8bc4 0442 0100 6100 ff6e 9042 341f 3229 000a 4e75

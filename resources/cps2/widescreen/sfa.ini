# Street Fighter Alpha: Warriors' Dreams (Europe 950727), CPS2 program.
# The profile patches the decrypted opcode region (USER1, the first 512 KiB)
# that the 68000 executes; the encrypted ROM image itself is not modified.
# Addresses are byte offsets in that region.
#
# Fights keep the scroll2 camera c in [0,384]: the native view sees stage
# X [64,832) and the tilemaps hold no art beyond it. The 480-pixel view
# [16,496) therefore shifts by 48 - c/4: 48 pixels inward at either edge,
# none at the center. Applied alike to scroll2, scroll3 and to objects placed
# by a layer camera, it keeps every layer scrolling at least 1/4 as fast as
# scroll2 inside the area it shows natively. scroll1 is the HUD here and,
# with the screen-fixed objects, keeps its place. The game's camera, walls
# and collisions are not modified. See docs/CPS_WIDESCREEN.md.
[profile]
version = 1
game = sfa
ngh = 0x0000
program_size = 0x80000
program_crc32 = 0x2baea2c3
status = verified
description = 480x224 stage view kept inside each stage, native camera and gameplay

# Scroll shadow registers for the next frame (0x16a4): after writing scroll2,
# jump out, add the shift to the scroll2 ($2e-0x100) and scroll3 ($32-64)
# shadows and come back at 0x16de. No stack use, d0/d1 as the original code
# (d1 is restored to 64). The bytes after the jump stay original.
[patch scroll-jump]
offsets = 0x16b8
original = 33ed 2f5e 0080 0110 302d 002e 0440 0100 3b40 2f5e 33ed 2f62 0080 0114 302d 0032
wide = 33ed 2f5e 0080 0110 4ef9 0007 f000 0100 3b40 2f5e 33ed 2f62 0080 0114 302d 0032

# End of the object origin routine (0x1225a): x - layer camera + 64 - d0,
# then minus the shift. Objects with no layer (byte 9 of the object is 0)
# take the screen-fixed path at 0x122a8 and keep their place.
[patch object-jump]
offsets = 0x1229c
original = 9868 0010 0644 0040 9840 4e75
wide = 9868 0010 4ef9 0007 f080 4e75

# 0x6f088-0x7ffff is 0xffff fill in the encrypted ROM. The shift is 0 unless
# the scroll2 layer record is active ($ff8280 == 1, fights) with c in
# [0,384]: then 48 - (c >> 2).
[patch scroll-routine]
offsets = 0x7f000
original = e80d 2f74 8cf5 11d5 9b2c 1c56 df3b 2605 24b7 0e25 6f75 b982 74ab 4b55 5c43 20aa 73d1 0cfa c7fe b07e 65fc 7c7f 19d6 199e 69cc b83a 0cdf fa49 7a52 a0aa d75a d9ca 921c 2679 06aa 3e14 97e3
wide = 302d 002e 0440 0100 3200 0c39 0001 00ff 8280 6610 0c41 0180 620a e441 4441 0641 0030 6002 7200 d041 3b40 2f5e 33ed 2f62 0080 0114 302d 0032 0440 0040 d041 3b40 2f62 7240 4ef9 0000 16de

# The scroll2 layer record's X ($ff8290) is c + 0x100 when objects are placed.
[patch object-routine]
offsets = 0x7f080
original = aa2f faa9 ee78 028a 8415 260c d234 b812 5281 1e52 2256 9577 985f 631b 01ea b32e 0144 33f1 b317 ef69 f42a b7c1
wide = 0644 0040 9840 3039 00ff 8290 0440 0100 0c39 0001 00ff 8280 6610 0c40 0180 620a e440 4440 0640 0030 9840 4e75

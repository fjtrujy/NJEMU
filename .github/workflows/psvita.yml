name: PS Vita CMAKE

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.target }} USE_CACHE=${{ matrix.use_cache || 'DEFAULT' }} GUI=${{ matrix.gui }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [MVS, NCDZ, CPS1, CPS2]
        gui: [OFF, ON]
        include:
          - target: MVS
            use_cache: ON
            gui: ON
          - target: CPS2
            use_cache: ON
            gui: ON
      fail-fast: false

    container: vitasdk/vitasdk:latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends build-essential git cmake python3

    - name: Install miniz 3.1.2
      run: |
        git clone --depth 1 --branch 3.1.2 https://github.com/richgel999/miniz.git
        cmake -S miniz -B miniz/build \
          -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake \
          -DCMAKE_INSTALL_PREFIX=${VITASDK}/arm-vita-eabi \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
          -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
        cmake --build miniz/build -j $(getconf _NPROCESSORS_ONLN)
        cmake --install miniz/build

    # libvita2d comes with the image (upstream no longer builds with GCC 15).

    - name: Install vitaGL
      run: |
        git clone --depth 1 https://github.com/Rinnegatamante/vitashark
        make -C vitashark -j $(getconf _NPROCESSORS_ONLN) install
        git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
        # Keep compatibility with the short-lived upstream helper rename
        # regression without requiring that broken revision to be present.
        if grep -R -q 'update_scissor_clear_precomputed_uniforms' vitaGL/source; then
          sed -i 's/update_scissor_clear_precomputed_uniforms/update_scissor_test_uniforms/g' vitaGL/source/*.c vitaGL/source/*.h
        fi
        make -C vitaGL -j $(getconf _NPROCESSORS_ONLN) USE_SCRATCH_MEMORY=1 install

    - name: Resolve cache override
      run: |
        if [ -n "${{ matrix.use_cache }}" ]; then
          echo "NJEMU_CACHE_ARG=-DUSE_CACHE=${{ matrix.use_cache }}" >> "$GITHUB_ENV"
        else
          echo "NJEMU_CACHE_ARG=" >> "$GITHUB_ENV"
        fi

    - name: Compile project
      run: |
        mkdir build
        cd build
        cmake -DPLATFORM="PSVITA" \
          -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake \
          -DTARGET="${{ matrix.target }}" \
          $NJEMU_CACHE_ARG \
          -DGUI=${{ matrix.gui }} \
          ..
        make -j $(getconf _NPROCESSORS_ONLN)
        cmake --install .

    - name: Validate generated metadata package
      run: |
        target_lower=$(printf '%s' "${{ matrix.target }}" | tr '[:upper:]' '[:lower:]')
        case "${{ matrix.target }}" in
          CPS2)
            test -s "build/install/game_database.cps2"
            test ! -e "build/install/game_metadata.cps2"
            test ! -e "build/install/rominfo.cps2"
            ;;
          *) test -s "build/install/game_metadata.${target_lower}" ;;
        esac
        case "${{ matrix.target }}" in
          CPS1|MVS) test -s "build/install/dip_metadata.${target_lower}" ;;
          *) test ! -e "build/install/dip_metadata.${target_lower}" ;;
        esac
        case "${{ matrix.target }}" in
          CPS1|CPS2|MVS) test -s "build/install/gamelist_${target_lower}.txt" ;;
          *) test ! -e "build/install/gamelist_${target_lower}.txt" ;;
        esac
        test "$(find build/install -maxdepth 1 -type f -name 'zipname*' | wc -l)" -eq 0

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: NJEMU-${{ steps.slug.outputs.sha8 }}-PSVITA-${{ matrix.target }}-cache_${{ matrix.use_cache || 'DEFAULT' }}-gui_${{ matrix.gui }}
        path: build/install/

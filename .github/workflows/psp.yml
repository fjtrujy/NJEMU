name: PSP

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.target }} USE_CACHE=${{ matrix.use_cache || 'DEFAULT' }} COMMAND_LIST=${{ matrix.command_list }} ADHOC=${{ matrix.adhoc }} SAVE_STATE=${{ matrix.save_state }} GUI=${{ matrix.gui }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [MVS, NCDZ, CPS1, CPS2]
        command_list: [OFF]
        adhoc: [OFF]
        save_state: [OFF]
        gui: [OFF, ON]
        include:
          - target: MVS
            use_cache: OFF
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: CPS2
            use_cache: OFF
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: CPS1
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: CPS2
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: MVS
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: NCDZ
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          # ADHOC is an MVS-only PSP capability.
          - target: MVS
            command_list: OFF
            adhoc: ON
            save_state: ON
            gui: ON
      fail-fast: false

    # miniz is already packaged in the development toolchain but has not yet
    # reached the latest stable PSP image.
    container: ghcr.io/pspdev/pspdev:develop
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        apk add build-base git bash python3
    

    - name: Resolve cache override
      run: |
        if [ -n "${{ matrix.use_cache }}" ]; then
          echo "NJEMU_CACHE_ARG=-DUSE_CACHE=${{ matrix.use_cache }}" >> "$GITHUB_ENV"
        else
          echo "NJEMU_CACHE_ARG=" >> "$GITHUB_ENV"
        fi

    - name: Compile project
      run: |
        mkdir build
        cd build
        cmake -DPLATFORM="PSP" \
          -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake \
          -DTARGET="${{ matrix.target }}" \
          $NJEMU_CACHE_ARG \
          -DCOMMAND_LIST=${{ matrix.command_list }} \
          -DADHOC=${{ matrix.adhoc }} \
          -DSAVE_STATE=${{ matrix.save_state }} \
          -DGUI=${{ matrix.gui }} \
          -DPSP_ME_AUDIO=OFF \
          ..
        cmake --build . --parallel $(getconf _NPROCESSORS_ONLN)
        cmake --install . --prefix "$PWD/install"

    - name: Validate translation package
      run: |
        python3 tools/build_translations.py
        test -f build/install/lang/en.lng
        test -f build/install/lang/es.lng
        test -f build/install/lang/ja.lng
        test -f build/install/lang/zh-Hans.lng
        test -f build/install/lang/zh-Hant.lng
        test "$(find build/install/lang -maxdepth 1 -type f -name '*.lng' | wc -l)" -eq 5

    - name: Validate generated metadata package
      run: |
        target_lower=$(printf '%s' "${{ matrix.target }}" | tr '[:upper:]' '[:lower:]')
        test -s "build/install/game_metadata.${target_lower}"
        case "${{ matrix.target }}" in
          CPS1|MVS) test -s "build/install/dip_metadata.${target_lower}" ;;
          *) test ! -e "build/install/dip_metadata.${target_lower}" ;;
        esac
        test "$(find build/install -maxdepth 1 -type f -name 'zipname*' | wc -l)" -eq 0

    - name: Validate PSP package metadata
      run: |
        target_lower=$(printf '%s' "${{ matrix.target }}" | tr '[:upper:]' '[:lower:]')
        rm -rf build/pbp-check
        mkdir -p build/pbp-check
        (
          cd build/pbp-check
          unpack-pbp ../install/EBOOT.PBP
        )
        cmp build/pbp-check/ICON0.PNG "data/${target_lower}.png"
        strings build/pbp-check/PARAM.SFO | grep -F "${{ matrix.target }} " | grep -F " for PSP"

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: NJEMU-${{ steps.slug.outputs.sha8 }}-${{ matrix.target }}-cache_${{ matrix.use_cache || 'DEFAULT' }}-command_list_${{ matrix.command_list }}-adhoc_${{ matrix.adhoc }}-save_state_${{ matrix.save_state }}-gui_${{ matrix.gui }}
        path: build/install/

  me-build:
    name: MVS PSP_ME_AUDIO=ON MIST build-only
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:develop
    steps:
    - uses: actions/checkout@v7

    - name: Install host build dependencies
      run: |
        apk add build-base git bash python3 xxd

    - name: Build and install Media Engine dependencies
      run: |
        git clone https://github.com/mcidclan/psp-media-engine-custom-core.git /tmp/psp-media-engine-custom-core
        git -C /tmp/psp-media-engine-custom-core checkout fe871e12754060f3b42fbca6b251bb8ee3ade453
        cmake -S /tmp/psp-media-engine-custom-core \
          -B /tmp/psp-media-engine-custom-core-build \
          -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake
        cmake --build /tmp/psp-media-engine-custom-core-build --parallel $(getconf _NPROCESSORS_ONLN)
        cmake --install /tmp/psp-media-engine-custom-core-build

        git clone https://github.com/mcidclan/psp-media-engine-safe-task.git /tmp/psp-media-engine-safe-task
        git -C /tmp/psp-media-engine-safe-task checkout 7d4c41f77b0be8815a720e0c8212ed504c01806d
        cmake -S /tmp/psp-media-engine-safe-task \
          -B /tmp/psp-media-engine-safe-task-build \
          -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake \
          -DPRX_FREE=1
        cmake --build /tmp/psp-media-engine-safe-task-build --parallel $(getconf _NPROCESSORS_ONLN)
        cmake --install /tmp/psp-media-engine-safe-task-build

    - name: Compile ME-enabled MVS builds
      run: |
        cmake -S . -B build-me-nogui \
          -DPLATFORM=PSP \
          -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake \
          -DTARGET=MVS \
          -DGUI=OFF \
          -DSAVE_STATE=OFF \
          -DCOMMAND_LIST=OFF \
          -DADHOC=OFF \
          -DPSP_AUDIO_PROFILE=OFF \
          -DPSP_ME_AUDIO=ON
        cmake --build build-me-nogui --parallel $(getconf _NPROCESSORS_ONLN)

        cmake -S . -B build-me-gui \
          -DPLATFORM=PSP \
          -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake \
          -DTARGET=MVS \
          -DGUI=ON \
          -DSAVE_STATE=OFF \
          -DCOMMAND_LIST=OFF \
          -DADHOC=OFF \
          -DPSP_AUDIO_PROFILE=OFF \
          -DPSP_ME_AUDIO=ON
        cmake --build build-me-gui --parallel $(getconf _NPROCESSORS_ONLN)

name: PSP

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.target }} COMMAND_LIST=${{ matrix.command_list }} ADHOC=${{ matrix.adhoc }} SAVE_STATE=${{ matrix.save_state }} GUI=${{ matrix.gui }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [MVS, NCDZ, CPS1, CPS2]
        command_list: [OFF]
        adhoc: [OFF]
        save_state: [OFF]
        gui: [OFF, ON]
        include:
          - target: CPS1
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: CPS2
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: MVS
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: NCDZ
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          # Translation-system fragility check: ADHOC used to participate in
          # the conditional UI-text ID/table layout. NCDZ does not support it.
          - target: CPS1
            command_list: OFF
            adhoc: ON
            save_state: ON
            gui: ON
          - target: CPS2
            command_list: OFF
            adhoc: ON
            save_state: ON
            gui: ON
          - target: MVS
            command_list: OFF
            adhoc: ON
            save_state: ON
            gui: ON
      fail-fast: false

    container: pspdev/pspdev:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apk add build-base git bash python3
    

    - name: Compile project
      run: |
        mkdir build
        cd build
        cmake -DPLATFORM="PSP" \
          -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake \
          -DTARGET="${{ matrix.target }}" \
          -DCOMMAND_LIST=${{ matrix.command_list }} \
          -DADHOC=${{ matrix.adhoc }} \
          -DSAVE_STATE=${{ matrix.save_state }} \
          -DGUI=${{ matrix.gui }} \
          ..
        cmake --build . --parallel $(getconf _NPROCESSORS_ONLN)
        cmake --install . --prefix "$PWD/install"

    - name: Validate translation package
      run: |
        python3 tools/build_translations.py
        test -f build/install/lang/en.lng
        test -f build/install/lang/es.lng
        test -f build/install/lang/ja.lng
        test -f build/install/lang/zh-Hans.lng
        test -f build/install/lang/zh-Hant.lng
        test "$(find build/install/lang -maxdepth 1 -type f -name '*.lng' | wc -l)" -eq 5

    - name: Validate PSP package metadata
      run: |
        target_lower=$(printf '%s' "${{ matrix.target }}" | tr '[:upper:]' '[:lower:]')
        rm -rf build/pbp-check
        mkdir -p build/pbp-check
        (
          cd build/pbp-check
          unpack-pbp ../install/EBOOT.PBP
        )
        cmp build/pbp-check/ICON0.PNG "data/${target_lower}.png"
        strings build/pbp-check/PARAM.SFO | grep -F "${{ matrix.target }} " | grep -F " for PSP"

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: NJEMU-${{ steps.slug.outputs.sha8 }}-${{ matrix.target }}-command_list_${{ matrix.command_list }}-adhoc_${{ matrix.adhoc }}-save_state_${{ matrix.save_state }}-gui_${{ matrix.gui }}
        path: build/install/

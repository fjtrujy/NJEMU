name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to validate/build without publishing
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve release channel and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Resolve release channel and validate source identity
        id: version
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          ref_type="${{ github.ref_type }}"

          if [[ "$event" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            channel=stable
            publish=false
          elif [[ "$ref_type" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            channel=stable
            publish=true
          else
            tag=development
            channel=development
            publish=true
          fi

          if [[ "$channel" == "stable" && ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          version_file="$RUNNER_TEMP/njemu-version.txt"
          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_VERSION_OUTPUT_FILE="$version_file" \
            -P cmake/NJEMUVersion.cmake
          version="$(cat "$version_file")"
          source_sha="$(git rev-parse HEAD)"

          if [[ "$channel" == "stable" && "$version" != "${tag#v}" ]]; then
            echo "Tagged source produced version '$version', expected '${tag#v}'" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            slug: desktop-linux
          - os: macos-latest
            label: macOS
            slug: desktop-macos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libbz2-dev libsdl2-dev libmad0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake sdl2 mad

      - name: Build canonical Desktop packages
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_release_cores.sh DESKTOP

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM="${{ matrix.slug }}" \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.slug }}
          path: release-assets/
          if-no-files-found: error

  psp:
    name: PSP
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:develop
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install dependencies
        run: apk add build-base git bash

      - name: Build and install Media Engine dependencies
        run: |
          git clone https://github.com/mcidclan/psp-media-engine-custom-core.git /tmp/psp-media-engine-custom-core
          git -C /tmp/psp-media-engine-custom-core checkout fe871e12754060f3b42fbca6b251bb8ee3ade453
          cmake -S /tmp/psp-media-engine-custom-core -B /tmp/psp-media-engine-custom-core-build -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake
          cmake --build /tmp/psp-media-engine-custom-core-build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install /tmp/psp-media-engine-custom-core-build

          git clone https://github.com/mcidclan/psp-media-engine-safe-task.git /tmp/psp-media-engine-safe-task
          git -C /tmp/psp-media-engine-safe-task checkout 7d4c41f77b0be8815a720e0c8212ed504c01806d
          cmake -S /tmp/psp-media-engine-safe-task -B /tmp/psp-media-engine-safe-task-build -DCMAKE_TOOLCHAIN_FILE=$PSPDEV/psp/share/pspdev.cmake -DPRX_FREE=1
          cmake --build /tmp/psp-media-engine-safe-task-build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install /tmp/psp-media-engine-safe-task-build

      - name: Build canonical PSP package
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_release_cores.sh PSP

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM=psp \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-psp
          path: release-assets/
          if-no-files-found: error

  ps2:
    name: PlayStation 2
    needs: version
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install dependencies
        run: apk add build-base git bash cmake

      - name: Checkout ps2_drivers
        uses: actions/checkout@v7
        with:
          repository: fjtrujy/ps2_drivers
          ref: njemu
          path: .ci-deps/ps2_drivers
          persist-credentials: false

      - name: Build and install ps2_drivers
        run: |
          git -C .ci-deps/ps2_drivers rev-parse HEAD
          cmake -S .ci-deps/ps2_drivers -B .ci-deps/ps2_drivers/build \
            -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
            -DBUILD_SAMPLES=OFF
          cmake --build .ci-deps/ps2_drivers/build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --build .ci-deps/ps2_drivers/build --target \
            ps2_drivers_irximg_check ps2_drivers_irximg_stage_check \
            ps2_drivers_img_payload_check ps2_drivers_hdd_launch_check \
            ps2_drivers_bootstrap_args_check
          cmake --install .ci-deps/ps2_drivers/build
          test -s "$PS2SDK/ports/lib/libps2_drivers_img.a"
          test -s "$PS2SDK/ports/include/ps2_hdd_launch.h"
          test -s "$PS2SDK/ports/share/ps2_drivers/ps2_drivers.irximg"
          test -s "$PS2SDK/ports/share/ps2_drivers/ps2_drivers_irximg_bootstrap.elf"

      - name: Build canonical PS2 package
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_release_cores.sh PS2

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM=ps2 \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-ps2
          path: release-assets/
          if-no-files-found: error

  psvita:
    name: PlayStation Vita
    needs: version
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git cmake

      - name: Install miniz 3.1.2
        run: |
          git clone --depth 1 --branch 3.1.2 https://github.com/richgel999/miniz.git
          cmake -S miniz -B miniz/build \
            -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=${VITASDK}/arm-vita-eabi \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build miniz/build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install miniz/build

      - name: Install VitaGL
        run: |
          git clone --depth 1 https://github.com/Rinnegatamante/vitashark
          make -C vitashark -j "$(getconf _NPROCESSORS_ONLN)" install
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
          if grep -R -q 'update_scissor_clear_precomputed_uniforms' vitaGL/source; then
            sed -i 's/update_scissor_clear_precomputed_uniforms/update_scissor_test_uniforms/g' vitaGL/source/*.c vitaGL/source/*.h
          fi
          make -C vitaGL -j "$(getconf _NPROCESSORS_ONLN)" USE_SCRATCH_MEMORY=1 install

      - name: Build canonical Vita package
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/build_release_cores.sh PSVITA

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM=psvita \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-psvita
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: needs.version.outputs.publish == 'true'
    needs: [version, desktop, psp, ps2, psvita]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Generate notes from commits since the preceding stable tag
        env:
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/host -B build-release-notes \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=TRUE
          cmake --build build-release-notes --parallel 2

          previous_tag=""
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ "$candidate" == "$RELEASE_TAG" ]] && continue
            if git merge-base --is-ancestor "$candidate" "$SOURCE_SHA"; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*.*.*' --sort=-v:refname)
          if [[ -n "$previous_tag" ]]; then
            git log --no-merges --format='%h%x09%s' \
              "${previous_tag}..${SOURCE_SHA}" > release-commits.tsv
          else
            # The first tagged release has no preceding version for comparison.
            previous_tag=initial
            git log --no-merges --format='%h%x09%s' \
              "$SOURCE_SHA" > release-commits.tsv
          fi
          ./build-release-notes/njemu-tool release-notes \
            release-commits.tsv "$previous_tag" \
            "$([[ "$CHANNEL" == stable ]] && echo "$RELEASE_TAG" || echo "$SOURCE_SHA")" \
            "$CHANNEL" "$SOURCE_SHA" release-notes.md
          cat release-notes.md

      - name: Download canonical packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 5
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip.json' | wc -l)" -eq 5
          ls -lh release-assets

      - name: Publish immutable stable release
        if: needs.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # Retrying a tag build must not replace downloads or reset counts.
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" \
              --title "NJEMU $RELEASE_VERSION" --notes-file release-notes.md --draft=false
            existing_assets="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" \
              --json assets --jq '.assets[].name')"
            for asset in release-assets/*.zip release-assets/*.zip.json; do
              if ! grep -Fxq "$(basename "$asset")" <<< "$existing_assets"; then
                gh release upload "$RELEASE_TAG" "$asset" --repo "$REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              release-assets/*.zip release-assets/*.zip.json \
              --repo "$REPOSITORY" --verify-tag \
              --title "NJEMU $RELEASE_VERSION" \
              --notes-file release-notes.md --latest
          fi

      - name: Refresh development release
        if: needs.version.outputs.channel == 'development'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$REPOSITORY/git/ref/tags/development" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$REPOSITORY/git/refs/tags/development" \
              -f sha="$SOURCE_SHA" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$REPOSITORY/git/refs" \
              -f ref='refs/tags/development' \
              -f sha="$SOURCE_SHA" \
              >/dev/null
          fi

          # Keep one rolling prerelease instead of deleting and recreating it.
          # The stable channel keeps immutable assets and historical counters.
          short_sha="${SOURCE_SHA:0:8}"
          if gh release view development --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit development --repo "$REPOSITORY" \
              --title "NJEMU Development · $VERSION ($short_sha)" \
              --notes-file release-notes.md --prerelease
            gh release upload development \
              release-assets/*.zip release-assets/*.zip.json \
              --repo "$REPOSITORY" --clobber
          else
            gh release create development \
              release-assets/*.zip release-assets/*.zip.json \
              --repo "$REPOSITORY" --verify-tag \
              --title "NJEMU Development · $VERSION ($short_sha)" \
              --notes-file release-notes.md --prerelease --latest=false
          fi

name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to validate/build without publishing
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve release channel and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Resolve release channel and validate source identity
        id: version
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          ref_type="${{ github.ref_type }}"

          if [[ "$event" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            channel=stable
            publish=false
          elif [[ "$ref_type" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            channel=stable
            publish=true
          else
            tag=development
            channel=development
            publish=true
          fi

          if [[ "$channel" == "stable" && ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          version_file="$RUNNER_TEMP/njemu-version.txt"
          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_VERSION_OUTPUT_FILE="$version_file" \
            -P cmake/NJEMUVersion.cmake
          version="$(cat "$version_file")"
          source_sha="$(git rev-parse HEAD)"

          if [[ "$channel" == "stable" && "$version" != "${tag#v}" ]]; then
            echo "Tagged source produced version '$version', expected '${tag#v}'" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            slug: desktop-linux
          - os: macos-latest
            label: macOS
            slug: desktop-macos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libbz2-dev libsdl2-dev libmad0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake sdl2 mad

      - name: Build canonical Desktop packages
        shell: bash
        run: |
          set -euo pipefail
          for core in CPS1 CPS2 MVS NCDZ; do
            core_lower="$(printf '%s' "$core" | tr '[:upper:]' '[:lower:]')"
            build="build-release-$core_lower"
            install="$PWD/release-stage/$core"
            cmake -S . -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DPLATFORM=DESKTOP \
              -DTARGET="$core" \
              -DNJEMU_CANONICAL_RELEASE=ON \
              -DBUILD_TESTING=OFF
            cmake --build "$build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$build" --prefix "$install"
          done

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM="${{ matrix.slug }}" \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.slug }}
          path: release-assets/
          if-no-files-found: error

  psp:
    name: PSP
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:develop
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install dependencies
        run: apk add build-base git bash

      - name: Build canonical PSP package
        shell: bash
        run: |
          set -euo pipefail
          for core in CPS1 CPS2 MVS NCDZ; do
            core_lower="$(printf '%s' "$core" | tr '[:upper:]' '[:lower:]')"
            build="build-release-$core_lower"
            install="$PWD/release-stage/$core"
            cmake -S . -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PSPDEV/psp/share/pspdev.cmake" \
              -DPLATFORM=PSP \
              -DTARGET="$core" \
              -DNJEMU_CANONICAL_RELEASE=ON \
              -DBUILD_TESTING=OFF
            cmake --build "$build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$build" --prefix "$install"
          done

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM=psp \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-psp
          path: release-assets/
          if-no-files-found: error

  ps2:
    name: PlayStation 2
    needs: version
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install dependencies
        run: apk add build-base git bash cmake

      - name: Checkout ps2_drivers
        uses: actions/checkout@v7
        with:
          repository: fjtrujy/ps2_drivers
          ref: njemu
          path: .ci-deps/ps2_drivers
          persist-credentials: false

      - name: Build and install ps2_drivers
        run: |
          cmake -S .ci-deps/ps2_drivers -B .ci-deps/ps2_drivers/build \
            -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
            -DBUILD_SAMPLES=OFF
          cmake --build .ci-deps/ps2_drivers/build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --build .ci-deps/ps2_drivers/build --target \
            ps2_drivers_irximg_check ps2_drivers_irximg_stage_check ps2_drivers_img_payload_check
          cmake --install .ci-deps/ps2_drivers/build

      - name: Build canonical PS2 package
        shell: bash
        run: |
          set -euo pipefail
          for core in CPS1 CPS2 MVS NCDZ; do
            core_lower="$(printf '%s' "$core" | tr '[:upper:]' '[:lower:]')"
            build="build-release-$core_lower"
            install="$PWD/release-stage/$core"

            feature_args=(
              -DGUI=ON
              -DSAVE_STATE=ON
              -DCOMMAND_LIST=ON
              -DUSE_CACHE=OFF
              -DPS2_FAST_CACHE=OFF
              -DPS2_EXTERNAL_IRX_IMAGE=OFF
              -DPS2_DIRTY_SPRITE_UPLOADS=OFF
            )
            if [[ "$core" == CPS2 || "$core" == MVS ]]; then
              feature_args+=(
                -DUSE_CACHE=ON
                -DPS2_FAST_CACHE=ON
                -DPS2_EXTERNAL_IRX_IMAGE=ON
              )
            fi
            if [[ "$core" == MVS ]]; then
              feature_args+=( -DPS2_DIRTY_SPRITE_UPLOADS=ON )
            fi

            cmake -S . -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
              -DPLATFORM=PS2 \
              -DTARGET="$core" \
              -DNJEMU_CANONICAL_RELEASE=ON \
              -DBUILD_TESTING=OFF \
              "${feature_args[@]}"

            grep -q '^GUI:BOOL=ON$' "$build/CMakeCache.txt"
            grep -q '^SAVE_STATE:BOOL=ON$' "$build/CMakeCache.txt"
            grep -q '^COMMAND_LIST:BOOL=ON$' "$build/CMakeCache.txt"
            if [[ "$core" == CPS2 || "$core" == MVS ]]; then
              grep -q '^USE_CACHE:BOOL=ON$' "$build/CMakeCache.txt"
              grep -q '^PS2_FAST_CACHE:BOOL=ON$' "$build/CMakeCache.txt"
              grep -q '^PS2_EXTERNAL_IRX_IMAGE:BOOL=ON$' "$build/CMakeCache.txt"
            else
              grep -q '^USE_CACHE:BOOL=OFF$' "$build/CMakeCache.txt"
              grep -q '^PS2_FAST_CACHE:BOOL=OFF$' "$build/CMakeCache.txt"
              grep -q '^PS2_EXTERNAL_IRX_IMAGE:BOOL=OFF$' "$build/CMakeCache.txt"
            fi
            if [[ "$core" == MVS ]]; then
              grep -q '^PS2_DIRTY_SPRITE_UPLOADS:BOOL=ON$' "$build/CMakeCache.txt"
            fi

            cmake --build "$build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$build" --prefix "$install"
          done

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM=ps2 \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-ps2
          path: release-assets/
          if-no-files-found: error

  psvita:
    name: PlayStation Vita
    needs: version
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    env:
      NJEMU_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
      NJEMU_GIT_SHA_OVERRIDE: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git cmake

      - name: Install miniz 3.1.2
        run: |
          git clone --depth 1 --branch 3.1.2 https://github.com/richgel999/miniz.git
          cmake -S miniz -B miniz/build \
            -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=${VITASDK}/arm-vita-eabi \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build miniz/build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install miniz/build

      - name: Install VitaGL
        run: |
          git clone --depth 1 https://github.com/Rinnegatamante/vitashark
          make -C vitashark -j "$(getconf _NPROCESSORS_ONLN)" install
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
          if grep -R -q 'update_scissor_clear_precomputed_uniforms' vitaGL/source; then
            sed -i 's/update_scissor_clear_precomputed_uniforms/update_scissor_test_uniforms/g' vitaGL/source/*.c vitaGL/source/*.h
          fi
          make -C vitaGL -j "$(getconf _NPROCESSORS_ONLN)" USE_SCRATCH_MEMORY=1 install

      - name: Build canonical Vita package
        shell: bash
        run: |
          set -euo pipefail
          for core in CPS1 CPS2 MVS NCDZ; do
            core_lower="$(printf '%s' "$core" | tr '[:upper:]' '[:lower:]')"
            build="build-release-$core_lower"
            install="$PWD/release-stage/$core"
            cmake -S . -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
              -DPLATFORM=PSVITA \
              -DTARGET="$core" \
              -DNJEMU_CANONICAL_RELEASE=ON \
              -DBUILD_TESTING=OFF
            cmake --build "$build" --parallel "$(getconf _NPROCESSORS_ONLN)"
            cmake --install "$build" --prefix "$install"
          done

          cmake \
            -DNJEMU_SOURCE_DIR="$PWD" \
            -DNJEMU_RELEASE_PLATFORM=psvita \
            -DNJEMU_RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -DNJEMU_INSTALL_CPS1="$PWD/release-stage/CPS1" \
            -DNJEMU_INSTALL_CPS2="$PWD/release-stage/CPS2" \
            -DNJEMU_INSTALL_MVS="$PWD/release-stage/MVS" \
            -DNJEMU_INSTALL_NCDZ="$PWD/release-stage/NCDZ" \
            -DNJEMU_RELEASE_OUTPUT_DIR="$PWD/release-assets" \
            -P cmake/NJEMUReleasePackage.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: release-psvita
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: needs.version.outputs.publish == 'true'
    needs: [version, desktop, psp, ps2, psvita]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download canonical packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 5
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip.json' | wc -l)" -eq 5
          ls -lh release-assets

      - name: Create stable release
        if: needs.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ needs.version.outputs.tag }}" \
            release-assets/*.zip \
            release-assets/*.zip.json \
            --verify-tag \
            --title "NJEMU ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --latest

      - name: Refresh development release
        if: needs.version.outputs.channel == 'development'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$REPOSITORY/git/ref/tags/development" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$REPOSITORY/git/refs/tags/development" \
              -f sha="$SOURCE_SHA" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$REPOSITORY/git/refs" \
              -f ref='refs/tags/development' \
              -f sha="$SOURCE_SHA" \
              >/dev/null
          fi

          if gh release view development --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete development --repo "$REPOSITORY" --yes
          fi

          # The development tag is force-moved on every master build. GitHub's
          # generated-notes API can reject that moving tag as an invalid
          # previous_tag, especially before the repository has a stable release.
          # Keep generated notes for immutable stable releases and use explicit
          # notes for this rolling prerelease.
          gh release create development \
            release-assets/*.zip \
            release-assets/*.zip.json \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "NJEMU Development · $VERSION" \
            --notes "Automated development build from the current master branch. This prerelease may be less stable than a tagged NJEMU release." \
            --prerelease \
            --latest=false

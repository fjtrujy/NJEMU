name: PS2 CMAKE

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.target }} COMMAND_LIST=${{ matrix.command_list }} ADHOC=${{ matrix.adhoc }} SAVE_STATE=${{ matrix.save_state }} GUI=${{ matrix.gui }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [MVS, NCDZ, CPS1, CPS2] 
        command_list: [OFF] #TODO: ON
        adhoc: [OFF] #TODO: ON
        save_state: [OFF] #TODO: OFF
        gui: [OFF, ON]
        exclude:
          - target: NCDZ
            adhoc: ON
          - adhoc: ON
            save_state: FALSE
        include:
          - target: CPS1
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: CPS2
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: MVS
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: NCDZ
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
      fail-fast: false

    container: ps2dev/ps2dev:latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        apk add build-base git bash cmake python3

    # Temporary cacheio dependencies for PS2 hardware validation.
    - name: Checkout PS2SDK fast_cache
      uses: actions/checkout@v7
      with:
        repository: ps2dev/ps2sdk
        ref: fast_cache
        path: .ci-deps/ps2sdk
        persist-credentials: false

    - name: Build and install PS2SDK
      working-directory: .ci-deps/ps2sdk
      run: |
        export PS2SDKSRC="$PWD"
        git rev-parse HEAD
        make -j "$(getconf _NPROCESSORS_ONLN)"
        make install
        test -s "$PS2SDK/iop/irx/cacheio.irx"
        test -s "$PS2SDK/ee/lib/libcacheio.a"

    - name: Checkout ps2_drivers njemu
      uses: actions/checkout@v7
      with:
        repository: fjtrujy/ps2_drivers
        ref: njemu
        path: .ci-deps/ps2_drivers
        persist-credentials: false

    - name: Build, validate and install ps2_drivers
      run: |
        git -C .ci-deps/ps2_drivers rev-parse HEAD
        cmake -S .ci-deps/ps2_drivers -B .ci-deps/ps2_drivers/build \
          -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
          -DBUILD_SAMPLES=OFF
        cmake --build .ci-deps/ps2_drivers/build \
          --parallel "$(getconf _NPROCESSORS_ONLN)"
        cmake --build .ci-deps/ps2_drivers/build --target \
          ps2_drivers_irximg_check ps2_drivers_irximg_stage_check \
          ps2_drivers_img_payload_check
        cmake --install .ci-deps/ps2_drivers/build
        test -s "$PS2SDK/ports/lib/libps2_drivers_img.a"
        test -s "$PS2SDK/ports/share/ps2_drivers/ps2_drivers.irximg"

    - name: Compile project
      run: |
        mkdir build
        cd build
        cmake -DPLATFORM="PS2" \
          -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/share/ps2dev.cmake \
          -DTARGET="${{ matrix.target }}" \
          -DCOMMAND_LIST=${{ matrix.command_list }} \
          -DADHOC=${{ matrix.adhoc }} \
          -DSAVE_STATE=${{ matrix.save_state }} \
          -DGUI=${{ matrix.gui }} \
          ..
        make -j $(getconf _NPROCESSORS_ONLN)
        cmake --install .

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: NJEMU-${{ steps.slug.outputs.sha8 }}-${{ matrix.target }}-command_list_${{ matrix.command_list }}-adhoc_${{ matrix.adhoc }}-save_state${{ matrix.save_state }}-gui_${{ matrix.gui }}
        path: build/install/

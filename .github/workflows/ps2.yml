name: PS2 CMAKE

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.target }} COMMAND_LIST=${{ matrix.command_list }} ADHOC=${{ matrix.adhoc }} SAVE_STATE=${{ matrix.save_state }} GUI=${{ matrix.gui }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [MVS, NCDZ, CPS1, CPS2] 
        command_list: [OFF] #TODO: ON
        adhoc: [OFF] #TODO: ON
        save_state: [OFF] #TODO: OFF
        gui: [OFF, ON]
        exclude:
          - target: NCDZ
            adhoc: ON
          - adhoc: ON
            save_state: FALSE
        include:
          - target: CPS1
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: CPS2
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: MVS
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - target: NCDZ
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
      fail-fast: false

    container: ps2dev/ps2dev:latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        apk add build-base git bash cmake python3

    - name: Compile project
      run: |
        mkdir build
        cd build
        cmake -DPLATFORM="PS2" \
          -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/share/ps2dev.cmake \
          -DTARGET="${{ matrix.target }}" \
          -DCOMMAND_LIST=${{ matrix.command_list }} \
          -DADHOC=${{ matrix.adhoc }} \
          -DSAVE_STATE=${{ matrix.save_state }} \
          -DGUI=${{ matrix.gui }} \
          ..
        make -j $(getconf _NPROCESSORS_ONLN)
        cmake --install .

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: NJEMU-${{ steps.slug.outputs.sha8 }}-${{ matrix.target }}-command_list_${{ matrix.command_list }}-adhoc_${{ matrix.adhoc }}-save_state${{ matrix.save_state }}-gui_${{ matrix.gui }}
        path: build/install/

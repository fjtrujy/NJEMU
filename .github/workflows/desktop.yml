name: Desktop

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.target }} COMMAND_LIST=${{ matrix.command_list }} ADHOC=${{ matrix.adhoc }} SAVE_STATE=${{ matrix.save_state }} GUI=${{ matrix.gui }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        target: [MVS, NCDZ, CPS1, CPS2]
        command_list: [OFF] #TODO: ON
        adhoc: [OFF] #TODO: ON
        save_state: [OFF] #TODO: OFF
        gui: [OFF, ON]
        exclude:
          - target: NCDZ
            adhoc: ON
          - adhoc: ON
            save_state: FALSE
        include:
          - os: ubuntu-latest
            target: CPS1
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - os: ubuntu-latest
            target: CPS2
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - os: ubuntu-latest
            target: MVS
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
          - os: ubuntu-latest
            target: NCDZ
            command_list: ON
            adhoc: OFF
            save_state: ON
            gui: ON
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Ubuntu dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          python3 \
          wget \
          unzip \
          libbz2-dev \
          libsdl2-dev\
          libmad0-dev


    - name: Install Mac dependencies
      if: matrix.os == 'macOS-latest'
      run: |
        brew update
        brew install cmake sdl2 libzip mad

    - name: Compile project
      run: |
        set -o pipefail
        mkdir build
        cd build
        cmake -DPLATFORM="DESKTOP" \
          -DTARGET="${{ matrix.target }}" \
          -DCOMMAND_LIST=${{ matrix.command_list }} \
          -DADHOC=${{ matrix.adhoc }} \
          -DSAVE_STATE=${{ matrix.save_state }} \
          -DGUI=${{ matrix.gui }} \
          ..
        if ! make -j $(getconf _NPROCESSORS_ONLN) 2>&1 | tee build.log; then
          echo "Desktop build failed; surfacing compiler/linker diagnostics as annotations"
          grep -E '(^|[[:space:]])(error:|fatal error:)|undefined reference|collect2: error|ld: error' build.log \
            | tail -40 \
            | sed 's/^/::error title=Desktop build::/' || true
          exit 2
        fi
        ctest --output-on-failure
        cmake --install .

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: NJEMU-${{ steps.slug.outputs.sha8 }}-${{ matrix.os }}-${{ matrix.target }}-command_list_${{ matrix.command_list }}-adhoc_${{ matrix.adhoc }}-save_state${{ matrix.save_state }}-gui_${{ matrix.gui }}
        path: build/install/
